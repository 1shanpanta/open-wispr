name: Build Bottles

# Disabled on this fork. The job builds a Homebrew bottle and uploads it to
# the upstream human37/open-wispr repo (hardcoded below), which this fork's
# token cannot write to, so it can only ever fail here. The auto-trigger on
# `release: [created]` is removed so cutting a release does not produce a red
# X; the workflow is manual-only (workflow_dispatch) and retained for upstream
# parity. Re-enable by restoring the `release` trigger and retargeting the tap.
on:
  workflow_dispatch:

jobs:
  bottle:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Build bottle
        run: |
          brew tap human37/open-wispr
          brew install --build-bottle human37/open-wispr/open-wispr
          brew bottle --no-rebuild human37/open-wispr/open-wispr

      - name: Upload bottle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in open-wispr--*.bottle.tar.gz; do
            mv "$f" "$(echo "$f" | sed 's/--/-/')"
          done
          gh release upload "${{ github.event.release.tag_name }}" open-wispr-*.bottle.tar.gz --repo human37/open-wispr
